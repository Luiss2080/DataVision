version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: datavision_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-datavision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - datavision_net

  redis:
    image: redis:7-alpine
    container_name: datavision_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - datavision_net

volumes:
  pgdata:
  redisdata:

networks:
  datavision_net:
    driver: bridge